name: rebuild-dist

# Post-merge hook on GitHub: after any push to main, rebuild dist/ to ensure
# the published artifact stays in sync with src/. Mirrors the local
# .githooks/post-merge hook for developers pulling main.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
